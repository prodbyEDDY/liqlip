[package]
name = "liqlip"
version = "0.1.0"
description = "Liqlip — a keyboard-first clipboard manager for Windows."
authors = ["Liqlip"]
edition = "2021"
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "liqlip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
# Pinned to the 2.11 line, same as Liquid Tools (the JS side pins @tauri-apps/api ~2.11).
# `tray-icon`: the tray; `image-png`: tray icon variants decoded from PNG bytes at runtime.
tauri = { version = "~2.11", features = ["tray-icon", "image-png"] }
# MUST be the first plugin registered: a second launch summons the running shelf and exits.
tauri-plugin-single-instance = "~2.4"
tauri-plugin-autostart = "~2.5"
# pick_exe (ignored apps / paste chords); later export/import dialogs (W2-B).
tauri-plugin-dialog = "~2.7"
# open_path (data/log folders); clip_open is W1-C's choice.
tauri-plugin-opener = "~2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Non-poisoning locks for every shared state core.
parking_lot = "0.12"
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }
# Store (W1-A): SQLite compiled in (FTS5 + trigram verified by W0, see ARCHITECTURE §0).
# W1-A: `functions` registers `liq_icontains` (Unicode case-insensitive search for terms
# shorter than a trigram; SQLite's LIKE folds ASCII only). No extra crates.
rusqlite = { version = "0.43", features = ["bundled", "functions"] }
# Image encode/decode for the clipboard (W1-B capture, W1-A thumbnails, W1-C writer).
# W1-B: `bmp` decodes CF_DIB / CF_DIBV5 (BmpDecoder::new_without_file_header); no extra crates.
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
# content_hash (src/content.rs): XXH3-128, stable since xxHash 0.8.0.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(windows)'.dependencies]
# The #[implement] macro (drag-out COM objects, W1-C) emits paths to `windows_core`,
# so it must be a direct dependency of the same minor as `windows`.
windows-core = "0.62"
# Only the Win32 surface actually used is gated in; each W1 agent adds its own features
# with a `# W1-X` comment.
windows = { version = "0.62", features = [
    # HWND / BOOL / HANDLE basics.
    "Win32_Foundation",
    # GetWindowLongPtrW / SetWindowLongPtrW (WS_EX_TOOLWINDOW on the shelf + HUD windows).
    "Win32_UI_WindowsAndMessaging",
    # GetUserDefaultUILanguage (i18n_native: `language: system`).
    "Win32_Globalization",
    # RegGetValueW (tray icon variant for a light / dark taskbar).
    "Win32_System_Registry",
    # W1-C paste: OpenClipboard/EmptyClipboard/SetClipboardData/RegisterClipboardFormatW/
    # GetClipboardSequenceNumber (writer.rs).
    "Win32_System_DataExchange",
    # W1-C paste: GlobalAlloc/GlobalLock/GlobalUnlock for clipboard + drag HGLOBALs.
    "Win32_System_Memory",
    # W1-C paste: CF_* constants, DROPEFFECT, IDropSource, OleInitialize (writer.rs, dragout.rs).
    "Win32_System_Ole",
    # W1-C paste: IDataObject/FORMATETC/STGMEDIUM/CoCreateInstance/CoInitializeEx (dragout.rs,
    # open.rs); STGMEDIUM / IDataObject_Impl are gated on StructuredStorage in windows 0.62.
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # W1-C paste: MK_LBUTTON / MODIFIERKEYS_FLAGS (IDropSource::QueryContinueDrag).
    "Win32_System_SystemServices",
    # W1-C paste: OpenProcess/QueryFullProcessImageNameW/OpenProcessToken (focus.rs, uipi.rs).
    "Win32_System_Threading",
    # W1-C paste: GetModuleHandleW for the hidden clipboard-owner window class.
    "Win32_System_LibraryLoader",
    # W1-C paste: GetTokenInformation(TokenIntegrityLevel) + SID sub-authorities (uipi.rs).
    "Win32_Security",
    # W1-C paste: GetFileVersionInfoW/VerQueryValueW (target app FileDescription, focus.rs).
    "Win32_Storage_FileSystem",
    # W1-C paste: SendInput/GetAsyncKeyState/MapVirtualKeyExW/GetKeyboardLayout (input.rs).
    "Win32_UI_Input_KeyboardAndMouse",
    # W1-C paste: DROPFILES, SHOpenWithDialog, SHDoDragDrop, shell data objects, drag helper.
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    # W1-C paste: RegisterClassExW (WNDCLASSEXW has an HBRUSH), CreateBitmap for the drag image.
    "Win32_Graphics_Gdi",
    # W1-B capture: clipboard listener + snapshot (Open/Enum/GetClipboardData, sequence number,
    # owner, AddClipboardFormatListener), HGLOBAL access, CF_HDROP (DragQueryFileW), app icons
    # (SHDefExtractIconW / SHGetFileInfoW → GetIconInfo → GetDIBits, COM per call), owner process,
    # FileDescription, message-only window — shares DataExchange/Memory/Threading/Com/
    # LibraryLoader/Storage_FileSystem/Gdi/UI_Shell above; plus the cloaked-window filter for
    # apps_running (DwmGetWindowAttribute):
    "Win32_Graphics_Dwm",
    # W1-D also relies on KeyboardAndMouse (RegisterHotKey), Threading (GetCurrentThreadId /
    # GetCurrentProcessId), LibraryLoader (SetWindowsHookExW) and Gdi (MonitorFromPoint) above.
    # W1-D: GetDpiForMonitor (a monitor's scale changed while the shelf is docked on it).
    "Win32_UI_HiDpi",
    # W1-D: QueryDisplayConfig / DisplayConfigGetDeviceInfo (monitor friendly names).
    "Win32_Devices_Display",
    # W2-A OCR: Windows.Media.Ocr (OcrEngine/OcrResult/OcrLine), SoftwareBitmap +
    # BitmapPixelFormat (Graphics_Imaging), DataWriter → IBuffer for
    # SoftwareBitmap::CreateCopyFromBuffer (Storage_Streams), Language for the recognizer
    # language (Globalization; also gates OcrEngine's language members), and
    # RoInitialize/RoUninitialize for the worker threads (Win32_System_WinRT). Foundation is
    # implied by the WinRT namespaces; SetThreadPriority comes from Win32_System_Threading.
    "Foundation",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Win32_System_WinRT",
] }
